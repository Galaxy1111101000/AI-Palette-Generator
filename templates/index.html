<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Generator</title>

    <style>
        body {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            background: #f4f0e8;
            color: #29251f;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 3rem;
        }

        form {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #c7bfb2;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            padding: 14px 20px;
            border: 0;
            border-radius: 6px;
            background: #29251f;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #655343;
        }

        .error {
            color: #a33a2b;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 30px;
        }

        .swatch {
            min-height: 190px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: end;
            gap: 6px;
            border-radius: 8px;
            color: white;
            text-shadow: 0 1px 3px rgb(0 0 0 / 50%);
            box-shadow: 0 8px 20px rgb(0 0 0 / 12%);
        }

        .swatch strong {
            font-size: 1.1rem;
        }

        .swatch span,
        .swatch small {
            font-family: monospace;
        }

        @media (max-width: 600px) {
            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
        .change-colour-button {
            margin-top: 12px;
            padding: 8px 10px;
            border: 1px solid rgb(255 255 255 / 45%);
            border-radius: 4px;
            background: rgb(0 0 0 / 20%);
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .change-colour-button:hover {
            background: rgb(0 0 0 / 35%);
        }
    </style>
</head>
<body>
    <h1>Palette Generator</h1>

    <form method="POST" action="/generate" enctype="multipart/form-data">
        <input
            type="text"
            name="description"
            placeholder="A calm coastal palette with ocean blue and warm sand"
            value="{{ description or '' }}"
        >

        <label for="photo">Or upload a photo</label>
        <input
            id="photo"
            type="file"
            name="photo"
            accept="image/png,image/jpeg,image/webp"
        />

        <button type="submit">Generate palette</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if palette %}
        <h2>{{ palette.title }}</h2>
        <p>{{ palette.description }}</p>

        <section class="palette">
            {% for colour in palette.colours %}
                <article
                    class="swatch"
                    data-color="{{ colour.hex }}"
                    style="background-color: {{ colour.hex }}"
                >
                    <strong class="colour-name">{{ colour.name }}</strong>
                    <span class="colour-hex">{{ colour.hex }}</span>
                    <small>{{ colour.role }}</small>

                    <button
                        type="button"
                        class="change-colour-button"
                        onclick="changeColour(this)">
                        Change colour
                    </button>
                </article>
            {% endfor %}
        </section>
    {% endif %}

    <script>
        function hexToHsl(hex) {
            hex = hex.replace("#", "");

            const red = parseInt(hex.substring(0, 2), 16) / 255;
            const green = parseInt(hex.substring(2, 4), 16) / 255;
            const blue = parseInt(hex.substring(4, 6), 16) / 255;

            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);

            let hue = 0;
            let saturation = 0;
            const lightness = (max + min) / 2;

            if (max !== min) {
                const difference = max - min;
                saturation = lightness > 0.5
                    ? difference / (2 - max - min)
                    : difference / (max + min);

                switch (max) {
                    case red:
                        hue = (green - blue) / difference + (green < blue ? 6 : 0);
                        break;
                    case green:
                        hue = (blue - red) / difference + 2;
                        break;
                    case blue:
                        hue = (red - green) / difference + 4;
                        break;
                }

                hue /= 6;
            }

            return {
                hue: hue * 360,
                saturation: saturation * 100,
                lightness: lightness * 100
            };
        }

        function hslToHex(hue, saturation, lightness) {
            saturation /= 100;
            lightness /= 100;
            const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
            const section = hue / 60;
            const secondComponent = chroma * (1 - Math.abs(section % 2 - 1));

            let red = 0;
            let blue = 0;
            let green = 0;

            if (section < 1) {
                red = chroma;
                green = secondComponent;
            } else if (section < 2) {
                red = secondComponent;
                green = chroma;
            } else if (section < 3) {
                green = chroma;
                blue = secondComponent;
            } else if (section < 4) {
                green = secondComponent;
                blue = chroma;
            } else if (section < 5) {
                red = secondComponent;
                blue = chroma;
            } else {
                red = chroma;
                blue = secondComponent;
            }

            const match = lightness - (chroma / 2);
            red = Math.round((red + match) * 255);
            green = Math.round((green + match) * 255);
            blue = Math.round((blue + match) * 255);

            return "#" + [red, green, blue]
                .map(value => value.toString(16).padStart(2, "0"))
                .join("")
                .toUpperCase();
        }

        function changeColour(button) {
            const swatch = button.closest(".swatch");
            const currentHex = swatch.dataset.color;
            const currentHsl = hexToHsl(currentHex);

            const lightnessOptions = [
                25,
                35,
                45,
                55,
                65,
                75
            ];

            const currentLightness = Math.round(currentHsl.lightness);

            const availableLightness = lightnessOptions.filter(
                lightness => Math.abs(lightness - currentLightness) > 8
            );

            const newLightness = availableLightness[
                Math.floor(Math.random() * availableLightness.length)
            ];

            const newHex = hslToHex(
                currentHsl.hue,
                currentHsl.saturation,
                newLightness
            );

            swatch.dataset.colour = newHex;
            swatch.style.backgroundColor = newHex;

            swatch.querySelector(".colour-hex").textContent = newHex;
        }
    </script>
</body>
</html>
