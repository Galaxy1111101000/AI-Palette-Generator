<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <title>Palette Generator</title>
</head>
<body>
    <h1>Palette Generator</h1>

    <form
        id="generator-form"
        method="POST"
        action="/generate"
        enctype="multipart/form-data"
    >
        <div class="search-bar">
            <input
                type="text"
                name="description"
                placeholder="A calm coastal palette with ocean blue and warm sand"
                value="{{ description or '' }}"
            >

            <label class="upload-button" for="photo" title="Upload a photo">
                <span aria-hidden="true">+</span>
                <span class="upload-label">Photo</span>
            </label>
            <input
                id="photo"
                class="file-input"
                type="file"
                name="photo"
                accept="image/png,image/jpeg,image/webp"
            >

            <button type="submit">Generate</button>
        </div>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if palette %}
        <h2>{{ palette.title }}</h2>
        <p>{{ palette.description }}</p>

        <div class="palette-actions">
            <a
                class="preview-button"
                id="preview-button"
                href="/preview?colours={{ palette.colours | map(attribute='hex') | join(',') | urlencode }}"
                onclick="openPreview(event)"
            >
                Preview landing page
            </a>

            <button
                class="export-button"
                type="button"
                onclick="exportPalettePdf()"
                aria-label="Export palette as PDF"
                title="Export palette as PDF"
            >
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2h14v-2" />
                </svg>
            </button>
        </div>

        <section class="palette">
            {% for colour in palette.colours %}
                <article
                    class="swatch"
                    data-color="{{ colour.hex }}"
                    style="background-color: {{ colour.hex }}"
                >
                    <strong class="colour-name">{{ colour.name }}</strong>
                    <span class="colour-hex">{{ colour.hex }}</span>
                    <small>{{ colour.role }}</small>

                    <button
                        type="button"
                        class="change-colour-button"
                        onclick="changeColour(this)">
                        Change colour
                    </button>
                </article>
            {% endfor %}
        </section>
    {% endif %}

    <script>
        function hexToHsl(hex) {
            hex = hex.replace("#", "");

            const red = parseInt(hex.substring(0, 2), 16) / 255;
            const green = parseInt(hex.substring(2, 4), 16) / 255;
            const blue = parseInt(hex.substring(4, 6), 16) / 255;

            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);

            let hue = 0;
            let saturation = 0;
            const lightness = (max + min) / 2;

            if (max !== min) {
                const difference = max - min;
                saturation = lightness > 0.5
                    ? difference / (2 - max - min)
                    : difference / (max + min);

                switch (max) {
                    case red:
                        hue = (green - blue) / difference + (green < blue ? 6 : 0);
                        break;
                    case green:
                        hue = (blue - red) / difference + 2;
                        break;
                    case blue:
                        hue = (red - green) / difference + 4;
                        break;
                }

                hue /= 6;
            }

            return {
                hue: hue * 360,
                saturation: saturation * 100,
                lightness: lightness * 100
            };
        }

        function hslToHex(hue, saturation, lightness) {
            saturation /= 100;
            lightness /= 100;
            const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
            const section = hue / 60;
            const secondComponent = chroma * (1 - Math.abs(section % 2 - 1));

            let red = 0;
            let blue = 0;
            let green = 0;

            if (section < 1) {
                red = chroma;
                green = secondComponent;
            } else if (section < 2) {
                red = secondComponent;
                green = chroma;
            } else if (section < 3) {
                green = chroma;
                blue = secondComponent;
            } else if (section < 4) {
                green = secondComponent;
                blue = chroma;
            } else if (section < 5) {
                red = secondComponent;
                blue = chroma;
            } else {
                red = chroma;
                blue = secondComponent;
            }

            const match = lightness - (chroma / 2);
            red = Math.round((red + match) * 255);
            green = Math.round((green + match) * 255);
            blue = Math.round((blue + match) * 255);

            return "#" + [red, green, blue]
                .map(value => value.toString(16).padStart(2, "0"))
                .join("")
                .toUpperCase();
        }

        function changeColour(button) {
            const swatch = button.closest(".swatch");
            const currentHex = swatch.dataset.color;
            const currentHsl = hexToHsl(currentHex);

            const lightnessOptions = [
                25,
                35,
                45,
                55,
                65,
                75
            ];

            const currentLightness = Math.round(currentHsl.lightness);

            const availableLightness = lightnessOptions.filter(
                lightness => Math.abs(lightness - currentLightness) > 8
            );

            const newLightness = availableLightness[
                Math.floor(Math.random() * availableLightness.length)
            ];

            const newHex = hslToHex(
                currentHsl.hue,
                currentHsl.saturation,
                newLightness
            );

            swatch.dataset.color = newHex;
            swatch.style.backgroundColor = newHex;

            swatch.querySelector(".colour-hex").textContent = newHex;
            savePaletteColours();
        }

        function openPreview(event) {
            event.preventDefault();

            const colours = Array.from(document.querySelectorAll(".swatch"))
                .map(swatch => swatch.dataset.color);
            const previewUrl = "/preview?colours="
                + encodeURIComponent(colours.join(","));

            window.location.href = previewUrl;
        }

        function exportPalettePdf() {
            window.print();
        }

        function getPaletteColours() {
            return Array.from(document.querySelectorAll(".swatch"))
                .map(swatch => swatch.dataset.color);
        }

        function savePaletteColours() {
            localStorage.setItem(
                "palette-agent-colours",
                JSON.stringify(getPaletteColours())
            );
        }

        function restorePaletteColours() {
            const savedColours = JSON.parse(
                localStorage.getItem("palette-agent-colours") || "null"
            );
            const swatches = document.querySelectorAll(".swatch");

            if (!Array.isArray(savedColours) || savedColours.length !== swatches.length) {
                return;
            }

            swatches.forEach((swatch, index) => {
                const colour = savedColours[index];
                swatch.dataset.color = colour;
                swatch.style.backgroundColor = colour;
                swatch.querySelector(".colour-hex").textContent = colour;
            });
        }

        document
            .querySelector("#generator-form")
            .addEventListener("submit", () => {
                localStorage.removeItem("palette-agent-colours");
            });

        document.querySelector("#photo").addEventListener("change", event => {
            const fileName = event.target.files[0]?.name;
            const uploadLabel = document.querySelector(".upload-label");

            if (fileName) {
                uploadLabel.textContent = fileName;
            }
        });

        restorePaletteColours();
    </script>
</body>
</html>
